<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f2" />
  <title>Commonplace — Learn something good</title>
  <style>
    :root {
      --ink: #20251f;
      --muted: #71786e;
      --paper: #f7f7f2;
      --white: #fff;
      --line: #e7e9e1;
      --green: #245c46;
      --green-dark: #183f31;
      --lime: #d5ef9b;
      --orange: #f1a77c;
      --lavender: #d9d2f5;
      --shadow: 0 20px 55px rgba(28, 42, 31, .09);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .shell { max-width: 1240px; margin: 0 auto; padding: 0 36px; }
    .topbar {
      height: 78px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 750; letter-spacing: -.7px; }
    .brand-mark { width: 31px; height: 31px; border-radius: 11px; background: var(--green); display: grid; place-items: center; color: white; font-size: 17px; }
    .nav { display: flex; align-items: center; gap: 29px; color: #62695f; font-size: 14px; }
    .nav a:hover, .nav a.active { color: var(--green); }
    .nav .saved-link { display:flex; align-items:center; gap:7px; }
    .count { background: var(--lime); color: var(--green-dark); border-radius: 20px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
    .avatar { width: 36px; height: 36px; display:grid; place-items:center; background:#e9ddca; border-radius:50%; font-size:13px; font-weight:700; }
    main { min-height: calc(100vh - 150px); }
    .hero { padding: 62px 0 42px; display: grid; grid-template-columns: 1fr 310px; align-items: end; gap: 30px; }
    .eyebrow { color: var(--green); font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; font-weight: 750; }
    h1 { font-size: clamp(42px, 6vw, 68px); line-height: .98; letter-spacing: -4.5px; margin: 18px 0 16px; max-width: 740px; }
    .hero p { color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; max-width: 555px; }
    .hero-note { background: #e9eddf; border-radius: 18px; padding: 20px; align-self: end; }
    .hero-note strong { display: block; font-size: 14px; margin-bottom: 7px; }
    .hero-note span { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .toolbar { display:flex; align-items:center; gap: 12px; padding: 18px 0 22px; border-top:1px solid var(--line); }
    .search { flex:1; position:relative; }
    .search svg { position:absolute; top:14px; left:15px; color:#81877e; }
    .search input, .select {
      width:100%; height:46px; border:1px solid var(--line); border-radius:13px;
      background:white; color:var(--ink); outline:none; padding:0 14px;
    }
    .search input { padding-left:43px; }
    .search input:focus, .select:focus, .field input:focus { border-color:#8aa996; box-shadow:0 0 0 3px rgba(36,92,70,.09); }
    .select { width:175px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; margin:14px 0 20px; }
    .section-head h2 { font-size:20px; letter-spacing:-.6px; margin:0; }
    .results-count { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; padding-bottom:65px; }
    .card { background:var(--white); border:1px solid #eceee8; border-radius:20px; overflow:hidden; transition:transform .2s, box-shadow .2s; cursor:pointer; }
    .card:hover { transform:translateY(-4px); box-shadow:var(--shadow); }
    .card-art { height:196px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .art-1 { background:#dbe8d4; } .art-2 { background:#f3dfd0; } .art-3 { background:#e6e0f5; }
    .art-4 { background:#e7e9ce; } .art-5 { background:#d6e9eb; } .art-6 { background:#f1d8dc; }
    .art-icon { font-size:76px; filter: drop-shadow(0 10px 12px rgba(0,0,0,.08)); transform:rotate(-7deg); }
    .art-shape { position:absolute; width:155px; height:155px; border:1px solid rgba(255,255,255,.65); border-radius:50%; }
    .art-shape:before, .art-shape:after { content:""; position:absolute; inset:18px; border:1px solid rgba(255,255,255,.55); border-radius:50%; }
    .art-shape:after { inset:38px; }
    .level { position:absolute; top:14px; left:14px; background:rgba(255,255,255,.83); border-radius:30px; padding:7px 10px; font-size:10px; text-transform:uppercase; letter-spacing:.8px; font-weight:750; }
    .heart { position:absolute; top:12px; right:12px; border:0; border-radius:50%; width:35px; height:35px; background:rgba(255,255,255,.87); font-size:18px; color:#5a6258; }
    .heart.on { color:#d05f57; }
    .card-content { padding:18px 18px 16px; }
    .category { font-size:10px; text-transform:uppercase; color:var(--green); letter-spacing:1.2px; font-weight:750; }
    .card h3 { font-size:18px; letter-spacing:-.5px; margin:8px 0 7px; }
    .teacher { color:var(--muted); font-size:13px; }
    .card-meta { display:flex; align-items:center; justify-content:space-between; border-top:1px solid #eff0eb; margin-top:17px; padding-top:13px; font-size:12px; }
    .meta-left { color:#6f766d; display:flex; gap:12px; }
    .price { color:var(--ink); font-size:15px; font-weight:750; }
    .empty { text-align:center; color:var(--muted); padding:70px 20px; grid-column:1/-1; }
    .empty-icon { font-size:38px; margin-bottom:12px; }
    .page-title { padding:50px 0 28px; }
    .page-title h1 { font-size:46px; letter-spacing:-2.5px; margin:12px 0; }
    .page-title p { color:var(--muted); margin:0; }
    .detail-layout { display:grid; grid-template-columns:1.3fr .7fr; gap:40px; padding-bottom:70px; }
    .detail-art { min-height:320px; border-radius:24px; display:grid; place-items:center; position:relative; overflow:hidden; }
    .detail-art .art-icon { font-size:110px; }
    .detail-copy h2 { font-size:25px; letter-spacing:-.8px; }
    .detail-copy p { color:#666e63; line-height:1.75; font-size:14px; }
    .detail-facts { display:flex; gap:24px; margin:20px 0; color:#62695f; font-size:13px; flex-wrap:wrap; }
    .detail-facts span { display:flex; gap:6px; align-items:center; }
    .booking-card { background:white; border:1px solid var(--line); border-radius:20px; padding:23px; height:max-content; box-shadow:0 12px 35px rgba(28,42,31,.05); position:sticky; top:20px; }
    .booking-card .price { font-size:25px; }
    .booking-card .price small { font-size:13px; color:var(--muted); font-weight:400; }
    .booking-card .select { margin:18px 0 12px; width:100%; }
    .button { border:0; background:var(--green); color:white; border-radius:12px; padding:14px 18px; font-weight:700; transition:background .2s, transform .2s; }
    .button:hover { background:var(--green-dark); transform:translateY(-1px); }
    .button.full { width:100%; }
    .button.secondary { background:#edf1e9; color:var(--green-dark); }
    .button.secondary:hover { background:#e2e9dc; }
    .note { font-size:11px; color:var(--muted); text-align:center; line-height:1.5; margin:12px 0 0; }
    .form-wrap { max-width:760px; margin:0 auto; padding:42px 0 75px; }
    .steps { display:flex; align-items:center; gap:11px; margin-bottom:30px; color:var(--muted); font-size:12px; }
    .step-dot { width:25px; height:25px; border-radius:50%; display:grid; place-items:center; background:#e7e9e1; color:#697166; font-weight:700; }
    .step-dot.active { background:var(--green); color:white; }
    .step-line { height:1px; width:35px; background:var(--line); }
    .form-panel { background:white; border:1px solid var(--line); border-radius:22px; padding:30px; }
    .form-panel h2 { margin:0 0 6px; letter-spacing:-.8px; font-size:25px; }
    .form-panel > p { color:var(--muted); font-size:14px; margin:0 0 24px; }
    .booking-summary { background:#f4f6f0; border-radius:14px; padding:15px; display:flex; justify-content:space-between; gap:15px; align-items:center; margin-bottom:25px; }
    .booking-summary strong { display:block; font-size:14px; margin-bottom:4px; }
    .booking-summary span { color:var(--muted); font-size:12px; }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field { display:flex; flex-direction:column; gap:7px; margin-bottom:17px; }
    .field label { font-size:12px; font-weight:700; }
    .field input { width:100%; height:45px; border:1px solid var(--line); border-radius:11px; padding:0 12px; outline:none; background:white; }
    .form-actions { display:flex; justify-content:space-between; gap:10px; margin-top:7px; }
    .success { text-align:center; padding:40px 15px; }
    .success-mark { width:70px; height:70px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; font-size:32px; background:var(--lime); color:var(--green); }
    .success h2 { margin:0 0 10px; font-size:29px; letter-spacing:-1px; }
    .success p { color:var(--muted); line-height:1.65; font-size:14px; max-width:440px; margin:0 auto 22px; }
    .booking-list { display:grid; gap:14px; padding-bottom:65px; }
    .booking-row { background:white; border:1px solid var(--line); border-radius:16px; padding:17px; display:flex; justify-content:space-between; gap:20px; align-items:center; }
    .booking-row h3 { margin:0 0 5px; font-size:16px; }
    .booking-row p { margin:0; color:var(--muted); font-size:12px; line-height:1.6; }
    .booking-status { background:#e7f0df; color:var(--green); padding:7px 10px; border-radius:20px; white-space:nowrap; font-size:11px; font-weight:700; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px); background:#20251f; color:white; padding:12px 18px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:10; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    footer { border-top:1px solid var(--line); padding:22px 0; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; }
    @media (max-width:800px) {
      .shell { padding:0 21px; }
      .hero { grid-template-columns:1fr; padding-top:45px; }
      .hero-note { display:none; }
      .grid { grid-template-columns:repeat(2,1fr); gap:14px; }
      .detail-layout { grid-template-columns:1fr; gap:20px; }
      .booking-card { position:static; }
    }
    @media (max-width:560px) {
      .shell { padding:0 16px; }
      .topbar { height:66px; }
      .nav { gap:14px; font-size:12px; }
      .nav .hide-mobile { display:none; }
      .avatar { width:32px; height:32px; }
      h1 { letter-spacing:-2.8px; }
      .toolbar { flex-wrap:wrap; }
      .search { flex-basis:100%; }
      .select { flex:1; width:auto; }
      .grid { grid-template-columns:1fr; }
      .card-art { height:185px; }
      .page-title h1 { font-size:38px; }
      .field-grid { grid-template-columns:1fr; gap:0; }
      .form-panel { padding:21px; }
      .booking-row { align-items:flex-start; }
      footer { gap:10px; flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" data-page="home" aria-label="Commonplace home">
        <span class="brand-mark">c</span> commonplace
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="#" data-page="home" class="active">Explore</a>
        <a href="#" data-page="bookings" class="saved-link">My bookings <span class="count" id="bookingCount">0</span></a>
        <a href="#" class="hide-mobile" data-page="about">How it works</a>
      </nav>
      <div class="avatar" title="Guest profile">G</div>
    </header>

    <main id="app"></main>

    <footer>
      <span>© 2025 Commonplace learning studio</span>
      <span>Good things happen when you learn together.</span>
    </footer>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const courses = [
      { id: 1, title: "The art of sourdough", category: "Food & craft", teacher: "with Maya Chen", level: "Beginner friendly", icon: "🍞", art: "art-1", date: "Sat, Nov 8", time: "10:00 AM", duration: "2.5 hours", price: 48, seats: 6, rating: "4.9", description: "Get your hands into the dough and discover the slow, satisfying magic of naturally leavened bread. You’ll leave with a starter, a fresh loaf, and the confidence to keep baking at home." },
      { id: 2, title: "Build your own still life", category: "Art & design", teacher: "with Theo Martin", level: "All levels", icon: "🎨", art: "art-2", date: "Sun, Nov 9", time: "1:00 PM", duration: "3 hours", price: 56, seats: 4, rating: "5.0", description: "A relaxed, playful introduction to painting what you see. Explore color, composition, and mark-making with a practicing artist—materials, tea, and a tiny bit of happy mess included." },
      { id: 3, title: "Clay, cups & quiet mornings", category: "Art & design", teacher: "with Iris Okafor", level: "Beginner friendly", icon: "🏺", art: "art-3", date: "Sat, Nov 15", time: "9:30 AM", duration: "2 hours", price: 62, seats: 3, rating: "4.8", description: "Slow down and make something useful. Learn the basics of hand-building with clay and shape a cup that’s entirely your own. We’ll handle the firing; you bring your curiosity." },
      { id: 4, title: "A little garden, anywhere", category: "Nature & home", teacher: "with Leo Alvarez", level: "All levels", icon: "🌱", art: "art-4", date: "Sun, Nov 16", time: "11:00 AM", duration: "2 hours", price: 42, seats: 8, rating: "4.9", description: "Turn even the smallest windowsill into a green sanctuary. Learn how to choose happy plants, pot them up, and keep them thriving—plus take home your own little garden." },
      { id: 5, title: "Film photos, no fear", category: "Photo & film", teacher: "with Sam Rivera", level: "All levels", icon: "📷", art: "art-5", date: "Sat, Nov 22", time: "2:00 PM", duration: "2.5 hours", price: 50, seats: 5, rating: "4.7", description: "Take the mystery out of shooting on film. Learn the basics of exposure, loading a camera, and finding a great frame. Bring your own camera or borrow one of ours." },
      { id: 6, title: "Flowers that feel like you", category: "Nature & home", teacher: "with Nia Brooks", level: "Beginner friendly", icon: "💐", art: "art-6", date: "Sun, Nov 23", time: "12:00 PM", duration: "2 hours", price: 58, seats: 2, rating: "5.0", description: "Make a loose, expressive arrangement using seasonal flowers. Nia will show you how to work with shape and texture, and you’ll take your finished bouquet home." }
    ];

    const key = "commonplace-bookings-v1";
    const favoritesKey = "commonplace-favorites-v1";
    const getBookings = () => JSON.parse(localStorage.getItem(key) || "[]");
    const getFavorites = () => JSON.parse(localStorage.getItem(favoritesKey) || "[]");
    const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    const app = document.getElementById("app");
    let currentCourse = null;
    let selectedDate = "";
    let filters = { query: "", category: "All categories", sort: "Featured" };

    const money = n => "$" + Number(n).toFixed(2);
    const icon = name => ({
      search: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>'
    }[name]);

    function updateCount() {
      document.getElementById("bookingCount").textContent = getBookings().length;
    }
    function artMarkup(course, detail = false) {
      return `<div class="${detail ? "detail-art" : "card-art"} ${course.art}">
        <div class="art-shape"></div><span class="art-icon">${course.icon}</span>
        ${detail ? "" : `<span class="level">${course.level}</span>`}
      </div>`;
    }
    function cardMarkup(course) {
      const saved = getFavorites().includes(course.id);
      return `<article class="card" data-open="${course.id}" tabindex="0" aria-label="View ${course.title}">
        <div class="card-art ${course.art}"><div class="art-shape"></div><span class="art-icon">${course.icon}</span>
          <span class="level">${course.level}</span>
          <button class="heart ${saved ? "on" : ""}" data-fav="${course.id}" aria-label="${saved ? "Remove from" : "Add to"} favorites">${saved ? "♥" : "♡"}</button>
        </div>
        <div class="card-content">
          <div class="category">${course.category}</div>
          <h3>${course.title}</h3>
          <div class="teacher">${course.teacher}</div>
          <div class="card-meta"><div class="meta-left"><span>★ ${course.rating}</span><span>◷ ${course.duration}</span></div><span class="price">${money(course.price)}</span></div>
        </div>
      </article>`;
    }
    function renderHome() {
      const cats = ["All categories", ...new Set(courses.map(c => c.category))];
      let list = courses.filter(c => {
        const text = `${c.title} ${c.category} ${c.teacher} ${c.description}`.toLowerCase();
        return text.includes(filters.query.toLowerCase()) && (filters.category === "All categories" || c.category === filters.category);
      });
      if (filters.sort === "Price: low to high") list.sort((a,b) => a.price-b.price);
      if (filters.sort === "Price: high to low") list.sort((a,b) => b.price-a.price);
      if (filters.sort === "Top rated") list.sort((a,b) => Number(b.rating)-Number(a.rating));
      app.innerHTML = `
        <section class="hero">
          <div><div class="eyebrow">A good place to begin</div>
            <h1>Make room for<br>something new.</h1>
            <p>Small-group classes led by people who love what they do. Learn a skill, meet good humans, and leave with something you made.</p>
          </div>
          <aside class="hero-note"><strong>✨ More than a class</strong><span>Thoughtful local experiences, made for real life. Just show up curious.</span></aside>
        </section>
        <div class="toolbar">
          <label class="search">${icon("search")}<input id="searchInput" value="${escapeHtml(filters.query)}" placeholder="Try “ceramics” or “baking”" aria-label="Search courses"></label>
          <select class="select" id="categoryFilter" aria-label="Filter category">${cats.map(c => `<option ${c === filters.category ? "selected" : ""}>${c}</option>`).join("")}</select>
          <select class="select" id="sortFilter" aria-label="Sort courses">
            ${["Featured","Top rated","Price: low to high","Price: high to low"].map(c=>`<option ${c===filters.sort?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="section-head"><h2>Find your next favorite thing</h2><span class="results-count">${list.length} ${list.length === 1 ? "class" : "classes"}</span></div>
        <section class="grid">${list.length ? list.map(cardMarkup).join("") : `<div class="empty"><div class="empty-icon">🔎</div><strong>No classes found</strong><p>Try another search or category.</p></div>`}</section>`;
      document.getElementById("searchInput").addEventListener("input", e => { filters.query=e.target.value; renderHome(); const x=document.getElementById("searchInput"); x.focus(); x.setSelectionRange(x.value.length,x.value.length); });
      document.getElementById("categoryFilter").addEventListener("change", e => { filters.category=e.target.value; renderHome(); });
      document.getElementById("sortFilter").addEventListener("change", e => { filters.sort=e.target.value; renderHome(); });
      app.querySelectorAll("[data-open]").forEach(el => {
        el.addEventListener("click", e => { if (!e.target.closest("[data-fav]")) showDetail(Number(el.dataset.open)); });
        el.addEventListener("keydown", e => { if (e.key === "Enter") showDetail(Number(el.dataset.open)); });
      });
      app.querySelectorAll("[data-fav]").forEach(btn => btn.addEventListener("click", e => {
        e.stopPropagation(); const id=Number(btn.dataset.fav); let favs=getFavorites();
        favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs,id]; save(favoritesKey,favs); renderHome(); toast(favs.includes(id) ? "Added to your saved classes" : "Removed from saved classes");
      }));
    }
    function showDetail(id) {
      currentCourse = courses.find(c=>c.id===id);
      const c=currentCourse;
      app.innerHTML = `
        <div class="page-title"><a href="#" data-back style="color:var(--green);font-size:13px">← Back to explore</a><div class="eyebrow" style="margin-top:22px">${c.category}</div><h1>${c.title}</h1><p>${c.teacher} · ★ ${c.rating} from lovely learners</p></div>
        <section class="detail-layout"><div>
          ${artMarkup(c,true)}
          <div class="detail-copy"><h2>A little about this class</h2><p>${c.description}</p>
            <div class="detail-facts"><span>◷ ${c.duration}</span><span>♙ ${c.seats} spots left</span><span>✦ ${c.level}</span></div>
            <h2>What you’ll get</h2><p>A friendly, welcoming small-group session, all essential materials, and a take-home creation. No experience needed—just bring yourself.</p>
            <h2>Meet your teacher</h2><p>${c.teacher.replace("with ","")} is a local maker and generous teacher who believes everyone can learn something by doing it together.</p>
          </div>
        </div>
        <aside class="booking-card"><div class="price">${money(c.price)} <small>/ person</small></div>
          <select class="select" id="dateSelect" aria-label="Choose a session"><option value="">Choose a session</option><option value="${c.date} · ${c.time}">${c.date} · ${c.time}</option></select>
          <button class="button full" id="bookButton">Reserve your spot</button>
          <p class="note">Small group · Free cancellation up to 48 hours before</p>
        </aside></section>`;
      app.querySelector("[data-back]").addEventListener("click", e => { e.preventDefault(); renderHome(); });
      document.getElementById("dateSelect").addEventListener("change", e => selectedDate=e.target.value);
      document.getElementById("bookButton").addEventListener("click", () => {
        selectedDate=document.getElementById("dateSelect").value;
        if (!selectedDate) return toast("Choose a session first");
        renderCheckout(c.id, selectedDate);
      });
      window.scrollTo(0,0);
    }
    function renderCheckout(id, date) {
      const c=courses.find(x=>x.id===id); selectedDate=date;
      app.innerHTML = `<div class="form-wrap">
        <div class="steps"><span class="step-dot active">1</span><span>Details</span><span class="step-line"></span><span class="step-dot">2</span><span>Confirmed</span></div>
        <section class="form-panel"><h2>Save your seat</h2><p>Almost there. Add your details to reserve a spot.</p>
          <div class="booking-summary"><div><strong>${c.title}</strong><span>${selectedDate} · ${c.duration}</span></div><strong>${money(c.price)}</strong></div>
          <form id="bookingForm">
            <div class="field-grid">
              <div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name" placeholder="Jamie Taylor"></div>
              <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
            </div>
            <div class="field"><label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="For day-of updates"></div>
            <div class="form-actions"><button class="button secondary" type="button" id="cancelCheckout">Back</button><button class="button" type="submit">Confirm booking · ${money(c.price)}</button></div>
            <p class="note">Demo checkout: no payment is collected. Your booking is stored on this device.</p>
          </form>
        </section></div>`;
      document.getElementById("cancelCheckout").addEventListener("click", () => showDetail(id));
      document.getElementById("bookingForm").addEventListener("submit", e => {
        e.preventDefault();
        const form=new FormData(e.currentTarget);
        const booking={id:Date.now(), courseId:c.id, name:form.get("name"), email:form.get("email"), phone:form.get("phone"), date:selectedDate, createdAt:new Date().toISOString()};
        save(key,[...getBookings(),booking]); updateCount(); renderSuccess(booking);
      });
      window.scrollTo(0,0);
    }
    function renderSuccess(booking) {
      const c=courses.find(x=>x.id===booking.courseId);
      app.innerHTML=`<div class="form-wrap"><div class="steps"><span class="step-dot active">✓</span><span>Details</span><span class="step-line"></span><span class="step-dot active">✓</span><span>Confirmed</span></div>
        <section class="form-panel success"><div class="success-mark">✓</div><h2>You’re on the list, ${escapeHtml(booking.name.split(" ")[0])}!</h2>
        <p>Your spot for <strong>${c.title}</strong> is reserved. We’ve saved your booking details here so you can find them any time.</p>
        <div class="booking-summary" style="text-align:left"><div><strong>${booking.date}</strong><span>Confirmation for ${escapeHtml(booking.email)}</span></div><strong>${money(c.price)}</strong></div>
        <button class="button" id="viewBookings">View my bookings</button> <button class="button secondary" id="browseMore">Explore more</button>
        </section></div>`;
      document.getElementById("viewBookings").addEventListener("click",renderBookings);
      document.getElementById("browseMore").addEventListener("click",renderHome);
      window.scrollTo(0,0);
    }
    function renderBookings() {
      const bookings=getBookings();
      app.innerHTML=`<section class="page-title"><div class="eyebrow">Your learning calendar</div><h1>My bookings</h1><p>All your lovely plans, in one place.</p></section>
        <section class="booking-list">${bookings.length ? bookings.slice().reverse().map(b=>{const c=courses.find(x=>x.id===b.courseId);return `<article class="booking-row"><div><h3>${c?.title || "Course"}</h3><p>${b.date}<br>Booked by ${escapeHtml(b.name)} · ${escapeHtml(b.email)}</p></div><span class="booking-status">Confirmed</span></article>`}).join("") : `<div class="empty"><div class="empty-icon">🗓️</div><strong>No bookings yet</strong><p>Your next good thing is waiting to be discovered.</p><button class="button" data-page="home" style="margin-top:12px">Explore classes</button></div>`}</section>`;
      app.querySelectorAll('[data-page="home"]').forEach(el=>el.addEventListener("click",renderHome));
      window.scrollTo(0,0);
    }
    function renderAbout() {
      app.innerHTML=`<section class="page-title"><div class="eyebrow">A little about us</div><h1>Learning feels better<br>together.</h1><p>Commonplace brings curious people and passionate local teachers together.</p></section>
      <div class="detail-layout" style="padding-top:5px"><div class="detail-copy"><h2>Made for trying things</h2><p>We think learning should feel welcoming, hands-on, and refreshingly human. Our small-group classes are led by people who love sharing what they know.</p><h2>How it works</h2><p>Pick a class that sparks your curiosity, choose a session, and reserve your spot. Show up ready to try something new. Your teacher takes care of the rest.</p></div><aside class="booking-card"><div style="font-size:35px">🌿</div><h3>Curiosity looks good on you.</h3><p class="teacher">Browse a class, meet your people, and make something memorable.</p><button class="button full" id="exploreButton">Explore classes</button></aside></div>`;
      document.getElementById("exploreButton").addEventListener("click",renderHome);
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }
    function toast(message) {
      const t=document.getElementById("toast"); t.textContent=message; t.classList.add("show");
      clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
    }
    document.querySelectorAll(".nav a[data-page], .brand[data-page]").forEach(el=>el.addEventListener("click",e=>{
      e.preventDefault(); document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a===el));
      if(el.dataset.page==="home") renderHome();
      if(el.dataset.page==="bookings") renderBookings();
      if(el.dataset.page==="about") renderAbout();
      window.scrollTo(0,0);
    }));
    updateCount();
    renderHome();
  </script>
</body>
</html>
